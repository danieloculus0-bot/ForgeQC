name: ForgeQC Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ForgeQC smoke test
        run: python -u smoke_test.py

      - name: Verify audit journal corruption regressions
        run: python -m unittest -v test_audit_journal_integrity

      - name: Verify related navigation regressions
        run: python -m unittest -v test_related_navigation
